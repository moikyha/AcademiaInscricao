<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição para a Academia Flor de Cacto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form action="mysql" method="post">
        <h1>🌺Flor de Cacto, academia exclusiva para mulheres: Inscrição🌵</h1>
        <label for="">Seu nome:</label>
        <input type="text" placeholder="Ex: Rosália">
        <label for="">Seu CPF:</label>
        <input type="text" placeholder="Ex: 000000000-00">
        <label for="">Sua data de nascimento:</label>
        <input type="text" placeholder="Ex: dd/mm/aaaa">
        <label for="">Quais áreas do corpo você procura trabalhar?</label>
        <input type="text" placeholder="Ex: Glúteos, peitoral, costas">

    <button type="submit">Garantir minha vaga 💪</button>
    
    </form>
    
</body>
</html>
